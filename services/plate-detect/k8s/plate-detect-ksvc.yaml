apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: plate-detect
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/metric: "concurrency"
        autoscaling.knative.dev/target: "5"
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/panic-threshold-percentage: "1000"
        autoscaling.knative.dev/scale-down-delay: "90s"
    spec:
      # Queue-proxy buffers requests beyond 5 in-flight per pod.
      containerConcurrency: 5
      containers:
        - image: zeiszotto/plate-detect:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              nvidia.com/gpu: "1"