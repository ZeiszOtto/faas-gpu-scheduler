mode: "save"  # "save" = mappába ment, "http" = Knative service-nek küld

services:
  face_detect: "http://face-detect.default.192-168-1-200.sslip.io/detect"
  plate_detect: "http://plate-detect.default.192-168-1-200.sslip.io/detect"

video:
  source: "../yolo-input/input_dataset.mp4"
  frame_skip: 1

filtering:
  min_person_height: 100   # pixel, ennél kisebb személyt kihagyjuk
  min_vehicle_width: 200   # pixel, ennél kisebb járművet kihagyjuk

crop_processing:
  enabled: true
  letterbox: true                   # true = aspect-aware resize + padding, false = stretch
  person:
    target_size: [240, 440]         # [width, height] — kb. 1:2 aspect (tipikus person)
  vehicle:
    target_size: [400, 400]         # [width, height] — 1:1 aspect (tipikus vehicle)

tracking:
  cooldown_frames: 15

yolo:
  model: "yolov8n.pt"
  confidence_threshold: 0.4
  device: "cuda:0"

logging:
  output: "results.log"

output:
  save_dir: "../yolo-output"